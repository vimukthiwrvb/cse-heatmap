# CI/CD: on every push to main, check data.xlsx, then publish the site to GitHub Pages.
name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:        # run the check (no deploy) on pull requests
  workflow_dispatch:   # adds a "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:               # CI: fail fast if the data is broken
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-data.js

  deploy:              # CD: only runs if "check" passed, and only on main
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect only the files the website needs
        run: |
          mkdir _site
          cp index.html xlsx.full.min.js data.xlsx _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
